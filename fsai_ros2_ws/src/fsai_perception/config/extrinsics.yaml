# Camera mounting in Fr1A vehicle frame
# Source: Sensor.4 (front_camera_rgb) in FS_Autonomous vehicle config
#
# Vehicle frame convention: X-forward, Y-left, Z-up
# Camera optical convention: X-right, Y-down, Z-into-scene
#
# rot convention: (roll, pitch, yaw) in degrees
#   positive pitch = nose tilted DOWN (CarMaker Y-left axis, right-hand rule)
camera:
  position:
    x: 1.532   # metres forward of rear axle reference
    y: 0.0     # centred laterally
    z: 0.816   # metres above ground
  rotation_deg:
    roll:  0.0
    pitch: 15.0   # 15 degrees downward — camera looks slightly at ground
    yaw:   0.0

# LiDAR mounting in Fr1A vehicle frame
# Source: Sensor.6 (Lidar_F) in FS_Autonomous vehicle config
lidar:
  position:
    x: 2.921
    y: 0.0
    z: 0.163
  rotation_deg:
    roll:  0.0
    pitch: 0.0
    yaw:   0.0
