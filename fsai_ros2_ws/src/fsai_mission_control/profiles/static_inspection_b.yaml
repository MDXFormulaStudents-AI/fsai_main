# Static Inspection B profile.
# Requirements reference: spin to 50 rpm, then trigger EBS / AS_EMERGENCY.

mission: static_inspection_b
completion_action: estop

steps:
  - name: ramp_to_50rpm
    type: ramp
    duration_s: 10.0
    start:
      steer_angle_deg: 0.0
      axle_speed_rpm: 0.0
      axle_torque_nm: 1000.0
      brake_pct: 0.0
    end:
      steer_angle_deg: 0.0
      axle_speed_rpm: 500.0
      axle_torque_nm: 1000.0
      brake_pct: 0.0

  - name: hold_50rpm
    type: hold
    duration_s: 5.0
    command:
      steer_angle_deg: 0.0
      axle_speed_rpm: 500.0
      axle_torque_nm: 1000.0
      brake_pct: 0.0
