# Autonomous Demonstration Mission profile.
# Requirements (FS-AI 2026 Rules IN2.3):
#   1. Sweep steering left and right, return to straight.
#   2. Accelerate for at least 10m.
#   3. Stop within a further 10m.
#   4. Accelerate for a further 10m.
#   5. Deploy EBS.
#
# Distance steps use rear-wheel odometry (wheel_circumference_m parameter, default 1.4m).
# Tune axle_torque_nm and axle_speed_rpm to match actual vehicle response.

mission: autonomous_demo
completion_action: estop

steps:
  # ── 1. Steer sweep ────────────────────────────────────────────────────────────
  # Light brake holds the car stationary while steering sweeps.

  - name: steer_sweep_left
    type: ramp
    duration_s: 2.0
    start:
      steer_angle_deg:  0.0
      axle_speed_rpm:   0.0
      axle_torque_nm:   0.0
      brake_pct:        5.0
    end:
      steer_angle_deg:  21.0
      axle_speed_rpm:   0.0
      axle_torque_nm:   0.0
      brake_pct:        5.0

  - name: steer_sweep_right
    type: ramp
    duration_s: 4.0
    start:
      steer_angle_deg:  21.0
      axle_speed_rpm:   0.0
      axle_torque_nm:   0.0
      brake_pct:        5.0
    end:
      steer_angle_deg: -21.0
      axle_speed_rpm:   0.0
      axle_torque_nm:   0.0
      brake_pct:        5.0

  - name: return_to_centre
    type: ramp
    duration_s: 2.0
    start:
      steer_angle_deg: -21.0
      axle_speed_rpm:   0.0
      axle_torque_nm:   0.0
      brake_pct:        5.0
    end:
      steer_angle_deg:  0.0
      axle_speed_rpm:   0.0
      axle_torque_nm:   0.0
      brake_pct:        5.0

  # ── 2. First drive leg (≥10m) ─────────────────────────────────────────────────
  # 12m gives a small margin over the 10m minimum.

  - name: drive_first_leg
    type: distance
    distance_m: 12.0
    command:
      steer_angle_deg:  0.0
      axle_speed_rpm:   500.0
      axle_torque_nm:   500.0
      brake_pct:        0.0

  # ── 3. Stop ───────────────────────────────────────────────────────────────────
  # 5 seconds at 30% brake. Adjust if the car needs more distance to stop.

  - name: stop_mid
    type: hold
    duration_s: 5.0
    command:
      steer_angle_deg:  0.0
      axle_speed_rpm:   0.0
      axle_torque_nm:   0.0
      brake_pct:        30.0

  # ── 4. Second drive leg (≥10m) ────────────────────────────────────────────────

  - name: drive_second_leg
    type: distance
    distance_m: 12.0
    command:
      steer_angle_deg:  0.0
      axle_speed_rpm:   500.0
      axle_torque_nm:   500.0
      brake_pct:        0.0

  # ── 5. EBS deployed via completion_action: estop ──────────────────────────────
